name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # v9 of the action is the one that ships golangci-lint v2, which is what
      # .golangci.yml declares.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the Docker-backed suite
        run: go test -tags e2e -count=1 -timeout 20m ./e2e/...

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Every target ships CGO_ENABLED=0, so a compile check here catches a
      # platform-specific mistake before a tag does.
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          set -eux
          for target in \
            linux/amd64 linux/arm64 linux/386 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 windows/386
          do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .
          done
